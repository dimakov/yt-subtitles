# Publishes a GitHub release when a version tag (v1.2.3) is pushed: checks the
# tag matches the manifest version, runs the tests, builds the store zip and
# attaches it, with that version's CHANGELOG.md section as the notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the tag matches the manifest version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi
      - name: Unit and manifest tests
        run: node --test
      - name: Build the store package
        run: python3 scripts/package.py
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*.zip
          --verify-tag
          --title "Subtitle Downloader for YouTube ${GITHUB_REF_NAME}"
          --notes-file release-notes.md
